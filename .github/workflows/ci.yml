name: CI

# Only the commit/issue gate for now. The build and test jobs land with the
# extension scaffold; adding empty jobs ahead of them would make CI green mean
# nothing, which is worse than CI being small.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  commit-issues:
    name: Every commit names an issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the commits this branch adds
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            # A push to master: check what this push added, not all of history.
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000) range="HEAD~1..HEAD" ;;
              *) range="$before..HEAD" ;;
            esac
          fi
          echo "checking $range"
          bad=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              Merge\ *|Revert\ *|fixup!\ *|squash!\ *|amend!\ *) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -Eq '#[0-9]+'; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") — names no issue"
              bad=$((bad+1))
            fi
          done < <(git rev-list --no-merges "$range" 2>/dev/null || true)
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad commit(s) name no issue. Add 'fixes #NNN' or 'refs #NNN' to the body."
            exit 1
          fi
          echo "every commit in range names an issue"
